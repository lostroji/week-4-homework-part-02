<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&display=swap"
          rel="stylesheet">
</head>
<body>

<!-- header -->
<header>
    <h3 class="orange-font-color">راهنماخانه</h3>
    <!-- navbar with two links-->
    <nav>
        <a href="#">فصل‌ها</a>
        <a href="#">درخواست راهنما</a>
    </nav>
</header>


<main>

    <!-- column grid div for intro, title of chapter, chapter description-->
    <div>
        <!-- intro section: intro card - (title - description - specs - red notif)-->
        <section class="media-grid-flex">
            <!-- single intro card -->
            <div class="card-intro-section">
                <div class="white-circle-bg"></div>
                <span>وب</span>
                <h1>راهنمای شروع یادگیری وب</h1>
                <p>نسخه آموزشی · PDF</p>
                <hr class="white-line"></hr>
            </div>

            <!-- title with description & small feature cards-->
            <div class="all-flex-container">
                <!-- title with description -->
                <h2>راهنمای شروع یادگیری وب</h2>
                <p class="gray-font-color">سه فصل کوتاه برای کسی کخ می‌خواهد ساختار صفحه، ظاهر و ثبت تغییرهای خود را مرور کند.</p>

                <!-- feature cards -->
                <div class="feature-card-container">
                    <div class="feature-cards">
                        <p class="gray-font-color">زبان</p>
                        <p class="orange-font-color orange-font-bold">نسحه فارسی</p>
                    </div>
                    <div class="feature-cards">
                        <p class="gray-font-color">حجم</p>
                        <p class="orange-font-color orange-font-bold">۴۰ صفحه</p>
                    </div>
                    <div class="feature-cards">
                        <p class="gray-font-color">قالب</p>
                        <p class="orange-font-color orange-font-bold">PDF آموزشی</p>
                    </div>

                </div>

                <!-- red notification -->
                <div class="red-notification-container">
                    <p>PDF در این تمرین تولید یا ارسال نمی‌شود.</p>
                </div>
            </div>
        </section>
    </div>

</main>

</body>
</html>
